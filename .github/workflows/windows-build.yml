name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Interaction-test native Windows app
        shell: pwsh
        run: |
          ./scripts/windows-interaction-smoke.ps1 `
            -ExePath "src-tauri/target/release/blackhole-tasks.exe" `
            -OutputDirectory "output/windows-smoke"

      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blackhole-tasks-windows-${{ github.run_number }}
          path: |
            src-tauri/target/release/blackhole-tasks.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows interaction screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blackhole-tasks-windows-smoke-${{ github.run_number }}
          path: output/windows-smoke/*
          if-no-files-found: warn
          retention-days: 14
