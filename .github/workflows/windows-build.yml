name: Windows Build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation depth
        required: true
        default: visual
        type: choice
        options:
          - visual
          - full

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Ensure Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  windows-visual:
    name: Windows visual evidence
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_mode == 'visual' }}
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Ensure Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify locked Tauri CLI supports no-bundle
        shell: pwsh
        run: |
          $help = npm run tauri -- build --help 2>&1 | Out-String
          if ($help -notmatch '--no-bundle') {
            throw "The project-locked Tauri CLI does not advertise --no-bundle."
          }
          $help | Select-String -- '--no-bundle'

      - name: Build runnable Tauri EXE without installers
        run: npm run tauri build -- --no-bundle

      - name: Capture native Windows visual evidence only
        shell: pwsh
        run: |
          ./scripts/windows-interaction-smoke.ps1 `
            -ExePath "src-tauri/target/release/blackhole-tasks.exe" `
            -OutputDirectory "output/windows-visual" `
            -VisualOnly

      - name: Upload Windows visual artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blackhole-tasks-windows-visual-${{ github.run_number }}
          path: |
            output/windows-visual/*
            src-tauri/target/release/blackhole-tasks.exe
          if-no-files-found: warn
          retention-days: 14

  windows-full:
    name: Full Windows validation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'full' }}
    needs: fast-checks
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Ensure Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri EXE and installers
        run: npm run tauri build

      - name: Interaction-test native Windows app
        shell: pwsh
        run: |
          ./scripts/windows-interaction-smoke.ps1 `
            -ExePath "src-tauri/target/release/blackhole-tasks.exe" `
            -OutputDirectory "output/windows-smoke"

      - name: Capture expanded Windows visual evidence
        shell: pwsh
        run: |
          ./scripts/windows-expanded-visual-evidence.ps1 `
            -ExePath "src-tauri/target/release/blackhole-tasks.exe" `
            -OutputPath "output/windows-smoke/02-single-scene-expanded.png"

      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blackhole-tasks-windows-${{ github.run_number }}
          path: |
            src-tauri/target/release/blackhole-tasks.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows full smoke artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blackhole-tasks-windows-smoke-${{ github.run_number }}
          path: output/windows-smoke/*
          if-no-files-found: warn
          retention-days: 14
