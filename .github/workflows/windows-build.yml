name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Smoke-test native Windows app
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri\target\release\blackhole-tasks.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "BlackHole Tasks exited during the native Windows smoke test with code $($process.ExitCode)."
            }
            if ($process.MainWindowHandle -ne 0 -and -not $process.Responding) {
              throw "BlackHole Tasks created a window but stopped responding."
            }
            "WINDOWS_NATIVE_SMOKE_OK pid=$($process.Id) window=$($process.MainWindowHandle)"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit(5000)
            }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v5
        with:
          name: blackhole-tasks-windows-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
